# LiteLLM: Anthropic format in, any provider out.
#
# The runner always speaks the Anthropic Messages format (ANTHROPIC_BASE_URL points here).
# LiteLLM translates that to Azure, Foundry, Vertex or Bedrock based on the model_name
# alias, which makes switching models an alias change rather than a container restart.
#
# Every key is read from the environment. No credential is written into this file, and
# none of them reaches a runner container - a runner only ever sees its own virtual key.

model_list:
  # --- Claude, straight from Anthropic ---
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY

  # --- Claude through Azure AI Foundry ---
  - model_name: claude-sonnet-foundry
    litellm_params:
      model: azure_ai/claude-sonnet-4-6
      api_base: os.environ/ANTHROPIC_FOUNDRY_BASE
      api_key: os.environ/ANTHROPIC_FOUNDRY_API_KEY

  # --- Azure OpenAI ---
  - model_name: gpt-azure
    litellm_params:
      model: azure/os.environ/AZURE_CHAT_DEPLOYMENT
      api_base: os.environ/AZURE_ENDPOINT
      api_key: os.environ/AZURE_API_KEY
      api_version: os.environ/AZURE_API_VERSION

  # --- OpenAI ---
  - model_name: gpt
    litellm_params:
      model: openai/gpt-6-sol
      api_key: os.environ/OPENAI_API_KEY

  # --- Google ---
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-3-pro
      api_key: os.environ/GOOGLE_GENERATIVE_AI_API_KEY

router_settings:
  # If the Anthropic balance runs dry, the same request goes through Foundry.
  fallbacks:
    - claude-sonnet: ["claude-sonnet-foundry"]

litellm_settings:
  # Drop parameters the target provider does not know, rather than failing the request.
  drop_params: true
